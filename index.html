<body>
  <section id="roleSelection">
    <h2>CamShare</h2>
    <button id="phoneRoleBtn">Use as Phone Camera</button>
    <button id="laptopRoleBtn">Use as Laptop</button>
  </section>

  <canvas id="recordingCanvas" width="1280" height="720" hidden></canvas>

  <video hidden id="screenPreview" autoplay playsinline></video>
  <video id="remoteCameraPreview" autoplay playsinline></video>
  <button hidden id="startBtn">Share Screen</button>
  <button hidden id="stopBtn">Stop Recording</button>
  <video hidden id="cameraPreview" autoplay playsinline></video>
  <button hidden id="cameraBtn">Open Phone Camera</button>
  <video hidden id="recordingPreview" controls></video>
  <button hidden id="downloadBtn">Download Recording</button>

  <script type="module">
    import { startScreenCapture, stopScreenCapture } from "./screen-capture.js";
    import { createRecorder } from "./recorder.js";

    let deviceRole = null;
    let pendingCandidates = [];

    // ------------------------- WebSocket Signaling -------------------------
    const signalingSocket = new WebSocket(
      "wss://cam-share-signaling-server.onrender.com",
    );
    signalingSocket.addEventListener("open", () => {
      console.log("Connected to signaling server");
    });

    signalingSocket.addEventListener("message", (event) => {
      const message = JSON.parse(event.data);

      if (message.type === "joined") {
        console.log("Successfully joined room:", message.roomId);
      } else if (message.type === "peers") {
        console.log("Devices already in room:", message.count);

        if (deviceRole === "laptop" && message.count > 0 && !peerConnection) {
          createOffer().catch((error) => {
            console.error("Could not create offer:", error);
          });
        }
      } else if (message.type === "peer-joined") {
        console.log("Another device joined!");

        if (deviceRole === "laptop" && !peerConnection) {
          createOffer().catch((error) => {
            console.error("Could not create offer:", error);
          });
        }
      } else if (message.type === "error") {
        console.error("Signaling error:", message.message);
      } else if (message.type === "offer" && deviceRole === "phone") {
        handleOffer(message.offer).catch(console.error);
      } else if (message.type === "answer" && deviceRole === "laptop") {
        handleAnswer(message.answer).catch(console.error);
      } else if (message.type === "ice-candidate") {
        handleIceCandidate(message.candidate).catch(console.error);
      } else {
        console.log("Signaling message:", message);
      }
    });

    signalingSocket.addEventListener("error", (error) => {
      console.error("WebSocket connection error:", error);
    });

    signalingSocket.addEventListener("close", () => {
      console.log("Disconnected from signaling server");
    });

    // ------------------------- WebRTC Peer Connection -------------------------
    const remoteCameraPreview = document.getElementById("remoteCameraPreview");

    let peerConnection = null;
    let cameraStream = null;

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection({
        iceServers: [
          {
            urls: "stun:stun.l.google.com:19302",
          },
        ],
      });

      peerConnection.addEventListener("track", (event) => {
        remoteCameraPreview.srcObject = event.streams[0];
      });

      peerConnection.addEventListener("icecandidate", (event) => {
        if (event.candidate) {
          sendSignal({
            type: "ice-candidate",
            candidate: event.candidate,
          });
        }
      });

      peerConnection.addEventListener("connectionstatechange", () => {
        console.log("WebRTC connection state:", peerConnection.connectionState);
      });
    }

    // ------------------------- Screen Recording -------------------------

    const button = document.getElementById("startBtn");
    const preview = document.getElementById("screenPreview");
    const stopButton = document.getElementById("stopBtn");
    const downloadButton = document.getElementById("downloadBtn");

    // Canvas Composition
    const recordingCanvas = document.getElementById("recordingCanvas");
    const canvasContext = recordingCanvas.getContext("2d");

    let stream = null;
    let recorder = null;
    let state = "idle";
    let url = null;
    let videoFrameCallbackId = null;
    let isCanvasRendering = false;
    let lastFrameTime = null;
    let canvasStream = null;

    button.addEventListener("click", async () => {
      try {
        if (
          state === "starting" ||
          state === "recording" ||
          state === "finalizing"
        ) {
          return;
        }

        state = "starting";

        stream = await startScreenCapture();
        const screenTrack = stream.getVideoTracks()[0];

        const recording = document.getElementById("recordingPreview");
        recording.pause();
        recording.removeAttribute("src");
        recording.hidden = true;
        downloadButton.hidden = true;

        preview.srcObject = stream;
        await preview.play();

        // Keep Canvas rendering available for future composition.
        // The current recording is the original screen stream.
        recordingCanvas.hidden = false;
        startCanvasRendering();

        canvasStream = recordingCanvas.captureStream(30);

        recorder = createRecorder(canvasStream);
        recorder.start();
        state = "recording";

        screenTrack.addEventListener(
          "ended",
          () => {
            console.log("Screen track ended.");
            finalizeRecording();
          },
          { once: true },
        );
      } catch (error) {
        state = "idle";

        stopCanvasRendering();
        stopScreenCapture(stream);
        stream = null;
        preview.srcObject = null;

        alert("Could not start screen recording: " + error.message);
        console.error(error);
      }
    });

    downloadButton.addEventListener("click", () => {
      const link = document.createElement("a");
      link.href = url;
      link.download = "screen-recording.webm";
      link.click();
    });

    stopButton.addEventListener("click", () => {
      finalizeRecording();
    });

    async function finalizeRecording() {
      if (state !== "recording" || !recorder) {
        return;
      }

      state = "finalizing";
      stopCanvasRendering();

      try {
        const blob = await recorder.stop();
        canvasStream.getTracks().forEach((track) => track.stop());
        canvasStream = null;

        const oldUrl = url;
        url = URL.createObjectURL(blob);

        const recording = document.getElementById("recordingPreview");
        recording.srcObject = null;
        recording.src = url;
        recording.hidden = false;

        downloadButton.hidden = false;

        if (oldUrl) {
          URL.revokeObjectURL(oldUrl);
        }

        stopScreenCapture(stream);
        stream = null;
        preview.srcObject = null;

        recorder = null;
        state = "completed";
      } catch (error) {
        console.error("Failed to finalize recording:", error);

        stopScreenCapture(stream);
        stream = null;
        preview.srcObject = null;

        if (canvasStream) {
          canvasStream.getTracks().forEach((track) => track.stop());
          canvasStream = null;
        }

        recorder = null;
        state = "idle";
      }
    }

    // ------------------------- Camera Preview -------------------------
    const cameraPreview = document.getElementById("cameraPreview");
    const cameraBtn = document.getElementById("cameraBtn");

    cameraBtn.addEventListener("click", async () => {
      try {
        const cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false,
        });

        cameraPreview.srcObject = cameraStream;
      } catch (error) {
        console.error(error);
        alert("Could not access the camera");
      }
    });

    const roleSelection = document.getElementById("roleSelection");
    const phoneRoleBtn = document.getElementById("phoneRoleBtn");
    const laptopRoleBtn = document.getElementById("laptopRoleBtn");

    phoneRoleBtn.addEventListener("click", () => {
      deviceRole = "phone";

      roleSelection.hidden = true;
      cameraBtn.hidden = false;
      cameraPreview.hidden = false;

      joinRoom();
    });

    laptopRoleBtn.addEventListener("click", () => {
      deviceRole = "laptop";

      roleSelection.hidden = true;

      preview.hidden = false;
      button.hidden = false;
      stopButton.hidden = false;

      cameraBtn.hidden = true;
      cameraPreview.hidden = true;

      joinRoom();
    });

    // ------------------------- Functions -------------------------

    function joinRoom() {
      if (signalingSocket.readyState !== WebSocket.OPEN) {
        console.error("Signaling server is not connected");
        return;
      }

      signalingSocket.send(
        JSON.stringify({
          type: "join",
          roomId: "camshare-123",
          role: deviceRole,
        }),
      );

      console.log(`Joining room as ${deviceRole}`);
    }

    function sendSignal(message) {
      if (signalingSocket.readyState !== WebSocket.OPEN) {
        console.error("Signaling server is not connected");
        return;
      }

      signalingSocket.send(
        JSON.stringify({
          ...message,
          role: deviceRole,
        }),
      );
    }

    async function createOffer() {
      createPeerConnection();

      peerConnection.addTransceiver("video", {
        direction: "recvonly",
      });

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      sendSignal({
        type: "offer",
        offer: peerConnection.localDescription,
      });

      console.log("Offer sent");
    }

    async function handleOffer(offer) {
      createPeerConnection();

      await peerConnection.setRemoteDescription(offer);
      await flushPendingCandidates();

      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false,
      });

      cameraPreview.srcObject = cameraStream;

      cameraStream.getTracks().forEach((track) => {
        peerConnection.addTrack(track, cameraStream);
      });

      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      sendSignal({
        type: "answer",
        answer: peerConnection.localDescription,
      });

      console.log("Answer sent with phone camera");
    }

    async function handleAnswer(answer) {
      await peerConnection.setRemoteDescription(answer);
      await flushPendingCandidates();

      console.log("Answer received and applied");
    }

    async function handleIceCandidate(candidate) {
      if (!peerConnection || !peerConnection.remoteDescription) {
        pendingCandidates.push(candidate);
        return;
      }

      await peerConnection.addIceCandidate(candidate);
    }

    async function flushPendingCandidates() {
      if (!peerConnection || !peerConnection.remoteDescription) {
        return;
      }

      const candidates = pendingCandidates;
      pendingCandidates = [];

      for (const candidate of candidates) {
        await peerConnection.addIceCandidate(candidate);
      }
    }

    //   }

    //   if (isCanvasRendering) {
    //     videoFrameCallbackId =
    //       preview.requestVideoFrameCallback(drawScreenFrame);
    //   }
    // }

    // function stopCanvasRendering() {
    //   isCanvasRendering = false;

    //   if (videoFrameCallbackId !== null) {
    //     preview.cancelVideoFrameCallback(videoFrameCallbackId);
    //     videoFrameCallbackId = null;
    //   }
    // }

    // function startCanvasRendering() {
    //   if (isCanvasRendering) return;

    //   isCanvasRendering = true;

    //   videoFrameCallbackId = preview.requestVideoFrameCallback(drawScreenFrame);
    // }

    let canvasRenderInterval = null;

    function drawScreenFrame() {
      const startTime = performance.now();

      if (!isCanvasRendering) return;

      if (!preview.videoWidth || !preview.videoHeight) return;

      canvasContext.drawImage(
        preview,
        0,
        0,
        recordingCanvas.width,
        recordingCanvas.height,
      );

      const cameraWidth = 320;
      const cameraHeight = 180;
      const margin = 24;

      if (remoteCameraPreview.readyState >= 2) {
        canvasContext.drawImage(
          remoteCameraPreview,
          recordingCanvas.width - cameraWidth - margin,
          recordingCanvas.height - cameraHeight - margin,
          cameraWidth,
          cameraHeight,
        );
      }

      const renderTime = performance.now() - startTime;

      if (renderTime > 16.67) {
        console.warn("Slow canvas rendering:", renderTime.toFixed(2), "ms");
      }
      console.count("Canvas frame rendered");
    }

    function startCanvasRendering() {
      if (isCanvasRendering) return;

      isCanvasRendering = true;

      canvasRenderInterval = setInterval(drawScreenFrame, 1000 / 30);
    }

    function stopCanvasRendering() {
      isCanvasRendering = false;

      if (canvasRenderInterval !== null) {
        clearInterval(canvasRenderInterval);
        canvasRenderInterval = null;
      }
    }
  </script>
</body>
