<body>
  <video id="screenPreview" autoplay playsinline></video>
  <button id="startBtn">Share Screen</button>
  <button id="stopBtn">Stop Recording</button>
  <video id="cameraPreview" autoplay playsinline></video>
  <button id="cameraBtn">Open Phone Camera</button>
  <video hidden id="recordingPreview" controls></video>
  <button hidden id="downloadBtn">Download Recording</button>

  <script>
    const button = document.getElementById("startBtn");
    const preview = document.getElementById("screenPreview");
    const stopButton = document.getElementById("stopBtn");
    const downloadButton = document.getElementById("downloadBtn");

    let stream;
    let recorder;
    let chunks;
    let state = "idle";
    let url = null;

    button.addEventListener("click", async () => {
      try {
        if (
          state === "starting" ||
          state === "recording" ||
          state === "finalizing"
        ) {
          return;
        }

        state = "starting";

        stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: false,
        });

        const recording = document.getElementById("recordingPreview");
        recording.src = null;
        recording.hidden = true;
        downloadButton.hidden = true;

        chunks = [];
        preview.srcObject = stream;

        recorder = new MediaRecorder(stream);

        recorder.addEventListener("dataavailable", (event) => {
          if (event.data.size > 0) {
            chunks.push(event.data);
          }
        });

        recorder.addEventListener("stop", () => {
          const blob = new Blob(chunks, {
            type: recorder.mimeType,
          });

          const oldUrl = url;
          url = URL.createObjectURL(blob);

          const recording = document.getElementById("recordingPreview");

          recording.srcObject = null;
          recording.src = url;

          recording.hidden = false;
          downloadButton.hidden = false;

          if (oldUrl) {
            URL.revokeObjectURL(oldUrl);
          }

          state = "completed";
          stream.getTracks().forEach((track) => track.stop());
          preview.srcObject = null;
        });

        stream.getVideoTracks()[0].addEventListener("ended", () => {
          if (state === "recording") {
            state = "finalizing";
            recorder.stop();
          }
        });

        recorder.start();
        state = "recording";
      } catch (error) {
        state = "idle";

        if (stream && stream.active) {
          stream.getTracks().forEach((track) => track.stop());
        }

        preview.srcObject = null;
        stream = null;
        alert("Could not start screen recording: " + error.message);
        console.error(error);
      }
    });

    downloadButton.addEventListener("click", () => {
      const link = document.createElement("a");
      link.href = url;
      link.download = "screen-recording.webm";
      link.click();
    });

    stopButton.addEventListener("click", () => {
      if (state !== "recording") {
        return;
      }
      if (recorder) {
        state = "finalizing";
        recorder.stop();
      }
    });

    // ------------------------- Camera Preview -------------------------
    const cameraPreview = document.getElementById("cameraPreview");
    const cameraBtn = document.getElementById("cameraBtn");

    cameraBtn.addEventListener("click", async () => {
      try {
        const cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false,
        });

        cameraPreview.srcObject = cameraStream;
      } catch (error) {
        console.error(error);
        alert("Could not access the camera");
      }
    });
  </script>
</body>
